[project]
name = "pyjaapp-backend"
version = "0.1.0"
description = "Serverless FastAPI with DynamoDB, S3, Cognito"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "mangum",
    "boto3",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-asyncio",
    "pre-commit",
    "black",
    "isort",
    "flake8"
]
