name: Deploy Serverless FastAPI

on:
  push:
    branches:
      - dev       # Deploys to DEV
      - main # Deploys to PROD

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Lambda Package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Determine Environment (Workspace)
        id: env-name
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "WORKSPACE=prod" >> $GITHUB_ENV
          else
            echo "WORKSPACE=dev" >> $GITHUB_ENV
          fi

      - name: Terraform Init & Apply
        working-directory: ./terraform
        run: |
          terraform init

          # Create workspace if it doesn't exist, otherwise select it
          terraform workspace select $WORKSPACE || terraform workspace new $WORKSPACE

          # Apply infrastructure specific to the workspace
          terraform apply -auto-approve -var="app_name=pyjaapp-backend" -var="environment=$WORKSPACE"
